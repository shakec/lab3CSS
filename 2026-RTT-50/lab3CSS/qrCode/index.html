<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>
    Frontend Mentor | QR code component
  </title>
</head>

<body style="--bs-body-font-family: 'Outfit', sans-serif;">
  <div style="height: 499px; width: 320px;" class="container-sm d-flex flex-column gap-3 rounded-5 shadow p-3 mb-5 bg-body-tertiary">
        <img src="./images/image-qr-code.png" class="img-fluid rounded-4" alt="QR Code on light blue background">
        <div class="text-center">
            <h4 class="fw-bold">Improve your front-end skills by building projects</h4>
            <p class="fs-6 text text-secondary">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
        </div>
  </div>
  
  <footer class="attribution text-center">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Shakeam Campbell</a>.
  </footer>
</body>
</html>
